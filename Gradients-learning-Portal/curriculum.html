<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curriculum Roadmap — Gradients ML LMS</title>
    
    <!-- CSS sheets -->
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    
    <style>
      /* Curriculum page custom styles */
      .curriculum-hero {
        padding: 5rem 0 3rem;
        text-align: center;
        background: radial-gradient(circle at top, rgba(59,130,246,0.05) 0%, transparent 60%);
        border-bottom: 1px solid var(--border-light);
      }
      .curriculum-hero h1 {
        font-size: 2.8rem;
        margin-bottom: 0.5rem;
      }
      .curriculum-hero .lead-text {
        font-size: 1.15rem;
        max-width: 600px;
        margin: 0 auto 1.5rem;
      }

      .curriculum-layout {
        padding: 4rem 2rem;
        display: flex;
        flex-direction: column;
        gap: 4rem;
      }

      .track-section {
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      .track-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 1px solid var(--border-light);
        padding-bottom: 1.5rem;
      }

      .track-title-block h2 {
        font-size: 1.8rem;
        margin-bottom: 0.5rem;
      }

      .track-title-block p {
        margin-bottom: 0;
        max-width: 800px;
        color: var(--text-secondary);
      }

      .track-meta-badge {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border-light);
        padding: 0.6rem 1.2rem;
        border-radius: var(--border-radius-md);
        text-align: center;
      }

      .track-meta-badge .label-upper {
        display: block;
        font-size: 0.7rem;
        color: var(--text-muted);
        text-transform: uppercase;
        font-weight: 600;
        letter-spacing: 0.05em;
        margin-bottom: 0.2rem;
      }

      .track-meta-badge .value {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--accent-cyan);
        font-family: var(--font-heading);
      }

      .modules-container {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      /* Module Card Layout */
      .module-card {
        border-radius: var(--border-radius-lg);
        overflow: hidden;
        transition: var(--transition-smooth);
      }

      .module-card:hover {
        border-color: rgba(255, 255, 255, 0.12);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .module-card-header {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 2rem;
        background: transparent;
        border: none;
        cursor: pointer;
        text-align: left;
        color: var(--text-primary);
      }

      .module-info-group {
        display: flex;
        flex-direction: column;
        gap: 0.35rem;
      }

      .module-label-row {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .module-number {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 0.75rem;
        text-transform: uppercase;
        color: var(--accent-blue);
        letter-spacing: 0.1em;
      }

      .module-badge-difficulty {
        font-size: 0.65rem;
        padding: 0.15rem 0.5rem;
        border-radius: 4px;
        font-weight: 600;
        background: rgba(6, 182, 212, 0.1);
        color: var(--accent-cyan);
      }

      .module-badge-difficulty.hard {
        background: rgba(139, 92, 246, 0.1);
        color: var(--accent-purple);
      }

      .module-name {
        font-size: 1.4rem;
        font-weight: 700;
        line-height: 1.3;
      }

      .module-meta-row {
        display: flex;
        gap: 1.5rem;
        font-size: 0.8rem;
        color: var(--text-muted);
        font-family: var(--font-heading);
      }

      .module-meta-item {
        display: flex;
        align-items: center;
        gap: 0.35rem;
      }

      .module-action-group {
        display: flex;
        align-items: center;
        gap: 1.5rem;
      }

      .completion-placeholder {
        width: 24px;
        height: 24px;
        border: 2px dashed var(--text-muted);
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-muted);
        font-size: 0.7rem;
      }

      .chevron-icon {
        font-size: 1rem;
        color: var(--text-muted);
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }

      /* Accordion Content */
      .module-card-body {
        max-height: 0;
        overflow: hidden;
        transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        background: rgba(0, 0, 0, 0.1);
        border-top: 1px solid transparent;
      }

      /* Expanded Class States */
      .module-card.expanded {
        border-color: rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.01);
      }

      .module-card.expanded .chevron-icon {
        transform: rotate(180deg);
      }

      .module-card.expanded .module-card-body {
        max-height: 1000px; /* Large limit for content reveal */
        border-color: var(--border-light);
      }

      /* Lesson list container */
      .lessons-grid {
        display: grid;
        grid-template-columns: 1fr;
        padding: 1.5rem 2rem;
        gap: 0.75rem;
      }

      /* Lesson item cards */
      .lesson-row-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 1.5rem;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--border-light);
        border-radius: var(--border-radius-sm);
        transition: var(--transition-smooth);
      }

      .lesson-row-card:hover {
        background: rgba(59, 130, 246, 0.04);
        border-color: var(--accent-blue);
        transform: translateX(4px);
      }

      .lesson-left-block {
        display: flex;
        align-items: center;
        gap: 1.25rem;
      }

      .lesson-num-tag {
        font-family: var(--font-mono);
        font-size: 0.85rem;
        color: var(--text-muted);
        font-weight: 500;
        min-width: 30px;
      }

      .lesson-title-text {
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--text-primary);
      }

      .lesson-type-badge {
        display: flex;
        align-items: center;
        gap: 0.35rem;
        padding: 0.3rem 0.75rem;
        border-radius: 4px;
        font-size: 0.75rem;
        font-family: var(--font-heading);
        font-weight: 600;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border-light);
        color: var(--text-secondary);
      }

      .lesson-type-badge.theory {
        color: var(--accent-cyan);
        background: rgba(6, 182, 212, 0.05);
      }

      .lesson-type-badge.math {
        color: var(--accent-blue);
        background: rgba(59, 130, 246, 0.05);
      }

      .lesson-type-badge.notebook {
        color: var(--accent-green);
        background: rgba(16, 185, 129, 0.05);
      }

      .lesson-type-badge.summary {
        color: var(--accent-purple);
        background: rgba(139, 92, 246, 0.05);
      }

      /* ── Dynamic Curriculum Renderer Styles ── */
      .track-detail-section {
        display: flex;
        flex-direction: column;
        gap: 2rem;
        margin-bottom: 3rem;
      }

      .track-detail-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        border-bottom: 1px solid var(--border-light);
        padding-bottom: 1.5rem;
      }

      .track-pct-pill {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border-light);
        padding: 0.6rem 1.2rem;
        border-radius: var(--border-radius-md);
        text-align: center;
      }

      .track-pct-pill .pct-num {
        display: block;
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--accent-cyan);
        font-family: var(--font-heading);
      }

      .track-pct-pill .pct-lbl {
        display: block;
        font-size: 0.7rem;
        color: var(--text-muted);
        text-transform: uppercase;
        font-weight: 600;
        letter-spacing: 0.05em;
        margin-top: 0.2rem;
      }

      .track-modules-list {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .module-block {
        border-radius: var(--border-radius-lg);
        overflow: hidden;
        transition: var(--transition-smooth);
      }

      .module-block-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 2rem;
        background: transparent;
        border: none;
      }

      .module-number-label {
        font-family: var(--font-heading);
        font-weight: 700;
        font-size: 0.75rem;
        text-transform: uppercase;
        color: var(--accent-blue);
        letter-spacing: 0.1em;
      }

      .module-block-header h3 {
        font-size: 1.4rem;
        font-weight: 700;
        margin: 0.35rem 0 0;
        line-height: 1.3;
      }

      .module-progress-text {
        font-size: 0.8rem;
        color: var(--text-muted);
        font-family: var(--font-heading);
      }

      .module-lessons-grid {
        display: grid;
        grid-template-columns: 1fr;
        padding: 0 2rem 1.5rem;
        gap: 0.75rem;
      }

      .lesson-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 1.5rem;
        background: rgba(255, 255, 255, 0.02);
        border: 1px solid var(--border-light);
        border-radius: var(--border-radius-sm);
        transition: var(--transition-smooth);
      }

      .lesson-card:hover {
        background: rgba(59, 130, 246, 0.04);
        border-color: var(--accent-blue);
        transform: translateX(4px);
      }

      .lesson-card.completed {
        border-color: rgba(16, 185, 129, 0.3);
        background: rgba(16, 185, 129, 0.03);
      }

      .lesson-card-state {
        display: flex;
        align-items: center;
        gap: 1rem;
      }

      .card-checkbox {
        width: 22px;
        height: 22px;
        border: 2px solid var(--text-muted);
        border-radius: 50%;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 0.7rem;
        color: transparent;
        transition: var(--transition-smooth);
        flex-shrink: 0;
      }

      .card-checkbox.checked {
        background: var(--accent-green);
        border-color: var(--accent-green);
        color: #fff;
      }

      .lesson-id-tag {
        font-family: var(--font-mono);
        font-size: 0.85rem;
        color: var(--text-muted);
        font-weight: 500;
        min-width: 30px;
      }

      .lesson-card-title {
        font-size: 0.95rem;
        font-weight: 500;
        color: var(--text-primary);
        margin: 0;
        flex: 1;
        padding: 0 1rem;
      }

      .lesson-card-link {
        font-size: 0.85rem;
        color: var(--accent-blue);
        text-decoration: none;
        white-space: nowrap;
      }

      .lesson-card-link:hover {
        text-decoration: underline;
      }

      .btn-reset {
        margin-top: 0.5rem;
      }

      @media (max-width: 768px) {
        .curriculum-hero {
          padding: 3rem 0 2rem;
        }
        .curriculum-hero h1 {
          font-size: 2.2rem;
        }
        .curriculum-layout {
          padding: 2rem 1rem;
        }
        .track-header,
        .track-detail-header {
          flex-direction: column;
          gap: 1rem;
        }
        .track-meta-badge,
        .track-pct-pill {
          align-self: flex-start;
        }
        .module-card-header,
        .module-block-header {
          padding: 1.25rem;
          flex-direction: column;
          align-items: flex-start;
          gap: 1rem;
        }
        .module-action-group {
          width: 100%;
          justify-content: space-between;
        }
        .lessons-grid,
        .module-lessons-grid {
          padding: 1rem;
        }
        .lesson-row-card,
        .lesson-card {
          flex-direction: column;
          align-items: flex-start;
          gap: 0.75rem;
          padding: 1rem;
        }
        .lesson-card-title {
          padding: 0;
        }
      }
    </style>
  </head>
  <body>
    <!-- Navigation Bar (Header Injector Mount) -->
    <header id="header-container" class="main-header glass"></header>

    <main class="main-content-wrapper fade-in">
      <div id="curriculum-page-container"></div>
    </main>

    <!-- Footer Injector Mount -->
    <footer id="footer-container" class="main-footer"></footer>

    <!-- Shared Static LMS Scripts -->
    <script src="js/app.js"></script>
    <script src="js/navigation.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/progress.js"></script>
  </body>
</html>
